name: sales-data-pipeline

services:
  postgres:
    image: postgres:16
    container_name: sales_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: sales_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: